baseURL = 'https://www.czyouge.xyz/'
locale = 'zh-CN'
defaultContentLanguage = 'zh'
title = '虫子游戈'
timeZone = 'Asia/Shanghai'
hasCJKLanguage = true
enableRobotsTXT = true
summaryLength = 90

[pagination]
  pagerSize = 10
[taxonomies]
  tag = 'tags'
[permalinks]
  tags = '/tag/:slug/'
[params]
  description = '一个讲故事的人类。小说、翻译，以及生活与技术的片段。'
  subtitle = '欢迎来到宇宙中的这个㮟㮟角角'
  author = '虫子游戈'
  googleAnalytics = 'G-0Z3PHKTB0H'
  canonicalBase = 'https://www.czyouge.xyz'
[markup.goldmark.renderer]
  unsafe = true
[markup.goldmark.parser.attribute]
  block = true
  title = true
[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['\\[', '\\]'], ['$$', '$$']]
    inline = [['\\(', '\\)'], ['$', '$']]
[markup.highlight]
  style = 'github-dark'
  lineNos = false
[markup.tableOfContents]
  startLevel = 1
  endLevel = 3
[outputs]
  home = ['HTML', 'RSS', 'Atom', 'JSON']
[outputFormats.RSS]
  baseName = 'rss'
[outputFormats.Atom]
  mediaType = 'application/atom+xml'
  baseName = 'atom'
  isPlainText = false
[mediaTypes.'application/atom+xml']
  suffixes = ['xml']

[[menus.main]]
  name = '文章'
  url = '/'
  weight = 1
[[menus.main]]
  name = '小说'
  url = '/novels/'
  weight = 2
[[menus.main]]
  name = '翻译'
  url = '/translation/'
  weight = 3
[[menus.main]]
  name = '归档'
  url = '/archives/'
  weight = 4
[[menus.main]]
  name = '关于'
  url = '/about/'
  weight = 5
